name: Build reviewed frontend static artifact

# Kept only on this fork's delivery branch, outside the upstream-ready fix.
on:
  push:
    branches:
      - ci/ma-frontend-static-artifact
    paths:
      - .github/workflows/frontend-static-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-static-artifact-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.x"
  PYTHON_VERSION: "3.12"
  SOURCE_SHA: "384005affcf8113952eaff985b7f326a0c07d737"
  BUILD_MODE: final
  BASE_FRONTEND_VERSION: "2.17.297"
  BASE_SOURCE_SHA: "e779b9d359e47cd210c2801f16a0ce6263571903"

jobs:
  verify-and-build:
    if: github.repository == 'alex-mextner/music-assistant-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the immutable source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source and build mode
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          case "$BUILD_MODE" in
            focused-red|final) ;;
            *) echo "::error::Unexpected build mode"; exit 1 ;;
          esac
          printf 'Source: %s\nMode: %s\n' "$SOURCE_SHA" "$BUILD_MODE"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: env.BUILD_MODE == 'final'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.8.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Run focused regression against unchanged production code
        if: env.BUILD_MODE == 'focused-red'
        run: >-
          pnpm test:run
          tests/components/PlayerGroupMembersTransfer.test.ts
          tests/components/PlayerCard.test.ts
          tests/plugins/api/index.test.ts
        env:
          CI: true

      - name: Run full tests
        if: env.BUILD_MODE == 'final'
        run: pnpm test:run
        env:
          CI: true

      - name: Lint
        if: env.BUILD_MODE == 'final'
        run: pnpm lint:check
        env:
          CI: true

      - name: Build
        if: env.BUILD_MODE == 'final'
        run: pnpm build
        env:
          CI: true

      - name: Build Python package
        if: env.BUILD_MODE == 'final'
        run: |
          python3 -m pip install build
          python3 -m build

      - name: Verify the Python package ships the frontend
        if: env.BUILD_MODE == 'final'
        run: .github/scripts/verify-python-package.sh

      - name: Verify tracked source stayed unchanged
        if: env.BUILD_MODE == 'final'
        run: git diff --exit-code HEAD

      - name: Prepare static payload and provenance manifest
        if: env.BUILD_MODE == 'final'
        shell: python
        run: |
          import datetime
          import hashlib
          import json
          import logging
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          import tomllib

          started = time.monotonic()
          log = tempfile.NamedTemporaryFile(
              mode="w", prefix="ma-frontend-artifact-", suffix=".log",
              dir="/tmp", delete=False,
          )
          os.chmod(log.name, 0o600)
          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s %(levelname)s %(message)s",
              handlers=[logging.StreamHandler(sys.stdout), logging.StreamHandler(log)],
          )
          logging.info("Log %s", log.name)
          try:
              source_sha = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip()
              if source_sha != os.environ["SOURCE_SHA"]:
                  raise RuntimeError("Source commit changed")
              frontend = Path("music_assistant_frontend")
              required = (
                  "__init__.py", "py.typed", "index.html", "sw.js",
                  "manifest.webmanifest", "assets",
              )
              if any(not (frontend / name).exists() for name in required):
                  raise RuntimeError("Built frontend is incomplete")
              if not any((frontend / "assets").glob("*.js")):
                  raise RuntimeError("Built frontend contains no JavaScript assets")
              files = sorted(path for path in frontend.rglob("*") if path.is_file())
              if any(path.is_symlink() for path in frontend.rglob("*")):
                  raise RuntimeError("Static payload contains a symlink")
              if any(
                  any(part.startswith(".") for part in path.parts)
                  or "\n" in path.as_posix() or "\r" in path.as_posix()
                  for path in files
              ):
                  raise RuntimeError("Static payload contains an unexpected path")
              payload = Path("frontend-static")
              payload.mkdir()
              shutil.copytree(frontend, payload / frontend.name)
              records = [
                  {
                      "path": path.as_posix(),
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in files
              ]
              project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
              manifest = {
                  "schema_version": 1,
                  "artifact_version": (
                      os.environ["BASE_FRONTEND_VERSION"]
                      + "+idle-group." + source_sha[:12]
                  ),
                  "base_frontend_version": os.environ["BASE_FRONTEND_VERSION"],
                  "base_source_sha": os.environ["BASE_SOURCE_SHA"],
                  "source_repository": os.environ["GITHUB_REPOSITORY"],
                  "source_sha": source_sha,
                  "workflow_sha": os.environ["GITHUB_SHA"],
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "source_package_version": project["version"],
                  "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "toolchain": {
                      "node": subprocess.check_output(["node", "--version"], text=True).strip(),
                      "pnpm": subprocess.check_output(["pnpm", "--version"], text=True).strip(),
                      "python": sys.version.split()[0],
                  },
                  "files": records,
              }
              manifest_path = payload / "manifest.json"
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
              checksum_lines = [
                  record["sha256"] + "  " + record["path"] for record in records
              ]
              checksum_lines.append(
                  hashlib.sha256(manifest_path.read_bytes()).hexdigest()
                  + "  manifest.json"
              )
              (payload / "SHA256SUMS").write_text("\n".join(checksum_lines) + "\n")
              logging.info("Prepared %s files for source %s", len(records), source_sha)
          except Exception:
              logging.exception("Artifact preparation failed")
              raise
          finally:
              logging.info("Elapsed %.2fs; log %s", time.monotonic() - started, log.name)
              log.flush()

      - name: Upload verified static artifact
        if: env.BUILD_MODE == 'final'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ma-frontend-static-${{ env.SOURCE_SHA }}
          path: frontend-static/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

      - name: Record artifact receipt
        if: env.BUILD_MODE == 'final'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            printf 'Source commit: %s\n\n' "$SOURCE_SHA"
            printf 'Artifact: %s\n\n' "$ARTIFACT_URL"
            printf 'Artifact SHA-256: %s\n' "$ARTIFACT_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
